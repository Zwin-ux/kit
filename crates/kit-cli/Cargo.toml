[package]
name = "kitctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Run coding agents (Claude Code, Codex, Grok, Ollama) in isolated git worktrees, prove the result with your repo's own checks, then land it"
readme = "../../README.md"
keywords = ["agents", "claude", "codex", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "kit"
path = "src/main.rs"

[dependencies]
kit-core.workspace = true
kit-agents.workspace = true
kit-gate.workspace = true
kit-tui.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
include_dir = "0.7"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
inquire.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
