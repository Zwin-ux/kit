[package]
name = "kitctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Set up Claude Code, Codex and Grok for one job with kits of skills, rules, MCP servers and hooks, then run agents in isolated worktrees and prove the result with your repo's own checks"
readme = "../../README.md"
keywords = ["agents", "claude", "codex", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "kit"
path = "src/main.rs"

[dependencies]
kit-core.workspace = true
kit-agents.workspace = true
kit-gate.workspace = true
kit-tui.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
include_dir = "0.7"
sha2 = "0.10"
serde.workspace = true
# Keys stay in the order the user wrote them when Kit edits their JSON.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["signal"] }
toml.workspace = true
toml_edit.workspace = true
inquire.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
