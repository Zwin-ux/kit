# Prices Kit ships, in USD per million tokens, copied from each provider's
# pricing page on the date below. A model with no entry shows tokens only:
# Kit never guesses a price. Add or override in ~/.kit/prices.toml:
#
#   [models."model-id"]
#   input = 3.0
#   cached_input = 0.3
#   cache_write = 3.75
#   output = 15.0
#
# Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
# cache_write is the 5-minute write, the cache Kit uses.
# Not listed: Claude Haiku 5.5, whose price changes above 100,000 prompt
# tokens; one rate here would understate long prompts.

as_of = "2026-11-01"

[models."claude-fable-5-1"]
input = 10.0
cache_write = 12.5
cached_input = 0.25
output = 50.0

[models."claude-opus-5-5"]
input = 4.0
cache_write = 5.0
cached_input = 0.2
output = 20.0

[models."claude-sonnet-5-5"]
input = 2.0
cache_write = 2.5
cached_input = 0.1
output = 10.0
