# cargo deny: licences, advisories and sources for every dependency
# (docs/PRD.md §8.3). CI runs `cargo deny check` in rust.yml.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# An advisory that cannot be fixed yet goes here with its id, the reason and
# a date to look again. Empty is the goal.
ignore = []

[licenses]
version = 2
# Permissive licences only, so Kit stays plain MIT for its users.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # Mozilla's CA certificate bundle (webpki-root-certs, via rustls-platform-verifier).
    # A permissive data licence; it does not change Kit's MIT terms.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
