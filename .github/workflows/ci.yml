# Kit continuous integration
# Additive only: test + doctor. No deploy, no secrets, no force-push.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "crates/kit-cli/claude-plugin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - "docs/dev/NATIVE-*.md"
      - ".gitattributes"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "crates/kit-cli/claude-plugin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - "docs/dev/NATIVE-*.md"
      - ".gitattributes"
      - ".github/workflows/ci.yml"

# Only cancel overlapping runs of THIS workflow on the same ref.
# Does not affect other workflows or repositories.
concurrency:
  group: kit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python for native archive checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Native Claude bundle integrity (no host required)
        run: node --test --test-name-pattern="packaged agent declarations" scripts/claude-plugin.test.mjs

      - name: Native lifecycle regressions (controlled host doubles)
        run: node --test scripts/native-lifecycle.test.mjs

      - name: Native alpha archive roundtrip and preservation (no host required)
        run: python scripts/package-native-alpha.test.py

      - name: Build packages
        run: pnpm build

      - name: Unit + e2e tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate all official packs
        run: pnpm exec node packages/cli/dist/bin.js test --all-packs

      - name: Doctor (repo health)
        run: pnpm exec node packages/cli/dist/bin.js doctor
        env:
          # Isolate CI home so doctor does not depend on a developer machine.
          KIT_HOME: ${{ runner.temp }}/kit-home

      - name: Package integrity smoke (pack → install → run)
        run: node scripts/pack-smoke.mjs
