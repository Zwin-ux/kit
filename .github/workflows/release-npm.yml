name: Release npm

# Tag push (v1.0.0-alpha.2, v1.0.0, …) builds every platform, publishes to
# npm and creates the GitHub Release (archives + SHA256SUMS).
# Manual runs build and pack everything, run `npm publish --dry-run` and
# create no release, unless `publish` is checked.
#
# Prerelease versions publish under their prerelease word (alpha, beta, rc),
# never `latest`, so `npm i -g @mzwin/kit` keeps serving 0.1.x until 1.0.0.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm and GitHub Releases (unchecked = dry run)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: kit.exe
            # Static CRT: the binary runs without the VC++ redistributable.
            rustflags: -C target-feature=+crt-static
          - target: aarch64-apple-darwin
            os: macos-14
            bin: kit
          - target: x86_64-apple-darwin
            os: macos-14
            bin: kit
          # zigbuild links against glibc 2.17, so the binary runs on
          # Debian 11, Ubuntu 20.04, RHEL 8 and Amazon Linux 2, not only
          # on hosts as new as the runner.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            bin: kit
            zig: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            bin: kit
            zig: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install zig
        if: matrix.zig
        run: pip3 install --user ziglang cargo-zigbuild

      - name: Build
        if: ${{ !matrix.zig }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p kit-cli --target ${{ matrix.target }}

      - name: Build (glibc 2.17)
        if: matrix.zig
        run: cargo zigbuild --release --locked -p kit-cli --target ${{ matrix.target }}.2.17

      - name: Check glibc floor
        if: matrix.zig
        run: |
          # No versioned glibc symbol newer than 2.17 may be required.
          newest=$(objdump -T target/${{ matrix.target }}/release/kit | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          [ "$(printf '%s\nGLIBC_2.17\n' "$newest" | sort -V | tail -1)" = "GLIBC_2.17" ]

      - name: Run the binary
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.bin }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  # Install the exact release artifacts the way users will, on each OS,
  # before anything is published.
  verify:
    name: verify ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, bin: kit.exe }
          - { target: aarch64-apple-darwin, os: macos-14, bin: kit }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, bin: kit }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, bin: kit }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: bins/${{ matrix.target }}

      - name: npm smoke on the release binary
        run: node scripts/npm-smoke.mjs --binary bins/${{ matrix.target }}/${{ matrix.bin }}

      - name: Runs on glibc 2.26 (Amazon Linux 2)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          chmod +x bins/${{ matrix.target }}/kit
          docker run --rm -v "$PWD/bins:/b:ro" amazonlinux:2 /b/${{ matrix.target }}/kit --version

  # Archives + SHA256SUMS for scripts/install.sh and scripts/install.ps1.
  # Runs next to `publish`. A dry run packs and checksums but creates no
  # release. A real run needs the tag v<version> to exist on GitHub.
  github-release:
    name: github release
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bins

      - name: Check tag matches Cargo version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -e 'import("./scripts/npm-stage.mjs").then(m => console.log(m.cargoVersion()))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Pack archives and SHA256SUMS
        run: |
          set -euo pipefail
          version=$(node -e 'import("./scripts/npm-stage.mjs").then(m => console.log(m.cargoVersion()))')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist/release
          count=0
          for bindir in bins/*/; do
            target=$(basename "$bindir")
            name="kit-$version-$target"
            stage="dist/stage/$name"
            mkdir -p "$stage"
            cp LICENSE README.md "$stage/"
            case "$target" in
              *windows*)
                cp "$bindir/kit.exe" "$stage/"
                (cd dist/stage && zip -qr "../release/$name.zip" "$name")
                ;;
              *)
                cp "$bindir/kit" "$stage/"
                chmod 755 "$stage/kit" # upload-artifact drops the mode bits
                tar -C dist/stage -czf "dist/release/$name.tar.gz" "$name"
                ;;
            esac
            count=$((count + 1))
          done
          [ "$count" -eq 5 ] || { echo "expected 5 targets, got $count" >&2; exit 1; }
          (cd dist/release && sha256sum -- kit-* > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/release/
          if-no-files-found: error

      - name: Create or update release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists: replacing assets"
            gh release upload "$tag" dist/release/* --clobber
            exit 0
          fi
          flags=(--verify-tag --title "Kit $VERSION")
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          cat > notes.md <<EOF
          Changes: [CHANGELOG.md](https://github.com/$GH_REPO/blob/$tag/CHANGELOG.md)

          Install: \`npm install -g @mzwin/kit@$VERSION\`, or \`scripts/install.sh\` / \`scripts/install.ps1\` with version $VERSION. Check the archives against \`SHA256SUMS\`.
          EOF
          gh release create "$tag" "${flags[@]}" --notes-file notes.md dist/release/*

  publish:
    name: publish
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: bins

      - name: Check tag matches Cargo version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -e 'import("./scripts/npm-stage.mjs").then(m => console.log(m.cargoVersion()))')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Stage packages
        run: node scripts/npm-stage.mjs --binaries bins

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./dist/npm/kit/package.json").version')
          case "$version" in
            *-*) tag=$(echo "${version#*-}" | sed 's/[.0-9].*//'); tag=${tag:-next} ;;
            *)   tag=latest ;;
          esac
          flags=(--access public --tag "$tag")
          if [ "$DRY_RUN" = "true" ]; then
            flags+=(--dry-run)
          else
            flags+=(--provenance)
          fi
          echo "version $version → dist-tag $tag (dry run: $DRY_RUN)"

          publish() {
            local dir=$1 name
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              return
            fi
            (cd "$dir" && npm publish "${flags[@]}")
          }

          # Platform packages first: the launcher must never point at
          # versions that do not exist yet.
          for dir in dist/npm/kit-*; do publish "$dir"; done
          publish dist/npm/kit
