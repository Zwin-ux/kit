name: Rust

on:
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/rust.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/rust.yml']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Windows is required from M0, not M5. Cross-platform TUIs die on Windows,
  # and finding out at release is finding out too late.
  quality:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # M0 kill criterion: cold start under 100ms. If this fails, the stack choice
  # is wrong and we stop rather than push through. See docs/dev/PRD-1.0.md §8.
  startup:
    name: startup budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p kit-cli

      - name: Install hyperfine
        run: |
          wget -q https://github.com/sharkdp/hyperfine/releases/download/v1.19.0/hyperfine_1.19.0_amd64.deb
          sudo dpkg -i hyperfine_1.19.0_amd64.deb

      - name: Measure cold start
        run: |
          hyperfine --warmup 3 --runs 50 --export-json startup.json \
            './target/release/kit --version'
          python3 - <<'PY'
          import json, sys
          mean_ms = json.load(open('startup.json'))['results'][0]['mean'] * 1000
          budget = 100.0
          print(f"cold start: {mean_ms:.1f}ms (budget {budget:.0f}ms)")
          if mean_ms > budget:
              sys.exit(f"FAIL: exceeds the M0 startup budget by {mean_ms - budget:.1f}ms")
          PY
